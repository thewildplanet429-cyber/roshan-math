name: Roshan Math APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoshanMath_Source_v1.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Source
        run: |
          unzip -q RoshanMath_Source_v1.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source
          PROJECT=$(find . -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roshan-Math-APK
          path: source/**/build/outputs/apk/debug/*.apk
